[project]
name = "vrp-agents"
version = "0.1.0"
description = "Multi-agent LLM reasoning for the Capacitated Vehicle Routing Problem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ayobami" }]
dependencies = [
    "anthropic>=0.39",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
